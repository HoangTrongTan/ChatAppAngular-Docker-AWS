<div class="flex items-end gap-3 p-4 bg-gray-900/80 backdrop-blur-xl border-t border-white/10">
  <div class="flex-1 relative">
    <textarea
      #textareaRef
      id="message-input"
      [(ngModel)]="messageText"
      (keydown.enter)="onEnter($event)"
      (input)="onInput()"
      placeholder="Type a message… (Enter to send, Shift+Enter for newline)"
      rows="1"
      class="w-full bg-gray-800 border border-white/10 rounded-2xl px-4 py-3 text-sm text-white placeholder-gray-500 resize-none overflow-hidden focus:outline-none focus:border-violet-500 focus:ring-1 focus:ring-violet-500 transition-all duration-200 max-h-32 scrollbar-thin"
      style="line-height: 1.5;"
    ></textarea>
  </div>

  <!-- Send button -->
  <button
    id="btn-send-message"
    (click)="submit()"
    [disabled]="!canSend()"
    class="flex-shrink-0 w-11 h-11 rounded-xl flex items-center justify-center transition-all duration-200 disabled:opacity-40 disabled:cursor-not-allowed bg-violet-600 hover:bg-violet-500 active:scale-95 shadow-lg shadow-violet-500/25"
  >
    <svg xmlns="http://www.w3.org/2000/svg" class="w-5 h-5 text-white" viewBox="0 0 24 24" fill="currentColor">
      <path d="M2.01 21L23 12 2.01 3 2 10l15 2-15 2z"></path>
    </svg>
  </button>
</div>
