<!-- Backdrop -->
<div
  @backdropAnim
  class="fixed inset-0 bg-black/60 backdrop-blur-sm z-[100] flex items-center justify-center p-4"
  (click)="closed.emit()"
>
  <!-- Dialog -->
  <div
    @dialogAnim
    class="bg-gray-900 border border-white/10 rounded-2xl p-6 w-full max-w-sm shadow-2xl"
    (click)="$event.stopPropagation()"
  >
    <div class="flex items-center justify-between mb-5">
      <h2 class="text-white font-bold text-lg">Choose your Avatar</h2>
      <button
        id="btn-close-avatar-picker"
        (click)="closed.emit()"
        class="text-gray-400 hover:text-white p-1 rounded-lg hover:bg-white/10 transition-all"
      >
        <svg xmlns="http://www.w3.org/2000/svg" class="w-5 h-5" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <line x1="18" y1="6" x2="6" y2="18"></line>
          <line x1="6" y1="6" x2="18" y2="18"></line>
        </svg>
      </button>
    </div>

    <div class="grid grid-cols-3 gap-4">
      @for (avatar of avatars; track avatar.index) {
        <div
          [id]="'avatar-option-' + avatar.index"
          (click)="onSelect(avatar.index)"
          [class]="(avatar.index === currentIndex
            ? 'border-violet-500 bg-violet-500/10'
            : 'border-white/10 hover:border-violet-400')
            + ' relative flex flex-col items-center gap-2 p-3 rounded-xl border-2 transition-all duration-200 hover:scale-105 cursor-pointer'"
        >
          <img
            [src]="avatar.url"
            [alt]="avatar.name"
            class="w-16 h-16 rounded-full object-cover"
          >
          <span
            [class]="(avatar.index === currentIndex ? 'text-violet-300' : 'text-gray-400') + ' text-xs font-medium'"
          >{{ avatar.name }}</span>

          @if (avatar.index === currentIndex) {
            <span class="absolute -top-1 -right-1 w-5 h-5 bg-violet-500 rounded-full flex items-center justify-center">
              <svg xmlns="http://www.w3.org/2000/svg" class="w-3 h-3 text-white" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3">
                <polyline points="20 6 9 17 4 12"></polyline>
              </svg>
            </span>
          }
        </div>
      }
    </div>
  </div>
</div>
